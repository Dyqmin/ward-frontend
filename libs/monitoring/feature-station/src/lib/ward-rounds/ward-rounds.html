<section class="page">
  <wm-page-header heading="Ward rounds" />

  <wm-card class="escalations" heading="Escalated to doctor">
    @for (a of escalated(); track a.event.alarmId) {
    <wm-alarm-actions [alarm]="a" />
    } @empty {
    <wm-empty-state
      message="Nothing escalated. Nurses acknowledge alarms within 20 s, or they come here."
    />
    }
  </wm-card>

  @for (w of wards; track w) {
  <h2 class="ward-title">{{ w }}</h2>
  <div class="grid">
    @for (bed of bedsOf(w); track bed) { @let patient = patients.patient(bed);
    <div class="slot">
      <wm-bed-tile [bed]="bed" />
      @if (patient) {
      <a class="button small" [routerLink]="['/ward', slug(bed), 'meds', 'new']"
        >Order medication</a
      >
      }
    </div>
    }
  </div>
  }
</section>
