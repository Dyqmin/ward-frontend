<!-- STEP 1.3: replace the <a …> line below with

-->
<!-- STEP 2.2: replace it again with
<a
  class="tile"
  [routerLink]="['/ward', slug()]"
  [class.stale]="stale()"
  [class.alarm]="urgent()"
  [class.empty]="patient() === null"
>
-->
<a class="tile" [routerLink]="['/ward', slug()]">
  <header>
    <h3>{{ bed() }}</h3>
    <!-- STEP 2.2: the patient, in its three states
    <span class="name">
      @switch (patient()) {
        @case (undefined) { … }
        @case (null) { Empty bed }
        @default { {{ patient()?.name }} }
      }
    </span>
    -->
  </header>

  <!-- STEP 1.1: live numbers, and a skeleton until the first frame
  @if (vitals.hasValue()) {
    @let v = vitals.value().frame;
    <div class="vitals">
      <span>HR {{ v.hr }}</span>
      <span>SpO₂ {{ v.spo2 }}</span>
      <span>RR {{ v.rr }}</span>
    </div>
    <footer class="row"></footer>
  } @else {
    <ngx-skeleton-loader count="3" />
  }
  -->

  <!-- STEP 1.2: for a moment, to show the clock at work (remove after STEP 1.3)
  <small class="muted">{{ ageSec() }} s old</small>
  -->

  <!-- STEP 1.3: the live / stale chip.
       Find the empty  <footer class="row"></footer>  (from STEP 1.1) and replace it with:
  <footer class="row">
    @if (stale()) {
      <span class="chip warn">no data for {{ ageSec() }} s</span>
    } @else {
      <span class="chip ok">live</span>
    }
  </footer>
  -->

  <!-- STEP 2.1: the readings as components.
       Find  <div class="vitals">  (from STEP 1.1) and replace it, with its three <span>s, with:
  <div class="vitals">
  <app-vital-value label="HR" vital="hr" [value]="v.hr" unit="bpm" [stale]="stale()" />
  <app-vital-value label="SpO₂" vital="spo2" [value]="v.spo2" unit="%" [stale]="stale()" />
  <app-vital-value label="RR" vital="rr" [value]="v.rr" unit="/min" [stale]="stale()" />
  </div>
  -->

  <!-- STEP 2.2: one chip per alarm on this bed, after the live / stale chip.
       Replace the whole <footer> (from STEP 1.3) with:
  <footer class="row">
    @if (stale()) {
      <span class="chip warn">no data for {{ ageSec() }} s</span>
    } @else {
      <span class="chip ok">live</span>
    }
    @for (a of alarms(); track a.event.alarmId) {
      <span class="chip" [class.bad]="isUrgent(a)">{{ alarmTitle(a) }} · {{ a.event.status }}</span>
    }
  </footer>
  -->
</a>
