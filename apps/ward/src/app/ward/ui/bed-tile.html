<!-- DAY 2 · LIVE CODING — the steps are explained in bed-tile.ts. -->

<!-- STEP 1.3: add [class.stale]="stale()" to the <a class="tile"> -->
<!-- STEP 2.2: add [class.alarm]="urgent()" and [class.empty]="patient() === null" to it -->
<a class="tile" [routerLink]="['/ward', slug()]">
  <header>
    <h3>{{ bed() }}</h3>
    <!-- STEP 2.2: the patient, in its three states
    <span class="name">
      @switch (patient()) {
        @case (undefined) { … }
        @case (null) { Empty bed }
        @default { {{ patient()?.name }} }
      }
    </span>
    -->
  </header>

  <!-- STEP 1.1: live numbers, and a skeleton until the first frame
  @if (vitals.hasValue()) {
    @let v = vitals.value().frame;
    <div class="vitals">
      <span>HR {{ v.hr }}</span>
      <span>SpO₂ {{ v.spo2 }}</span>
      <span>RR {{ v.rr }}</span>
    </div>
    <footer class="row">
      (STEP 1.3 goes here)
      (STEP 2.2 alarms go here)
    </footer>
  } @else {
    <ngx-skeleton-loader count="3" />
  }
  -->

  <!-- STEP 1.2: for a moment, to show the clock at work (remove after STEP 1.3)
  <small class="muted">{{ ageSec() }} s old</small>
  -->

  <!-- STEP 1.3: inside <footer>, the chip
  @if (stale()) {
    <span class="chip warn">no data for {{ ageSec() }} s</span>
  } @else {
    <span class="chip ok">live</span>
  }
  -->

  <!-- STEP 2.1: replace the three <span>s inside <div class="vitals"> with
  <app-vital-value label="HR" vital="hr" [value]="v.hr" unit="bpm" [stale]="stale()" />
  <app-vital-value label="SpO₂" vital="spo2" [value]="v.spo2" unit="%" [stale]="stale()" />
  <app-vital-value label="RR" vital="rr" [value]="v.rr" unit="/min" [stale]="stale()" />
  -->

  <!-- STEP 2.2: inside <footer>, after the chip: one chip per alarm on this bed
  @for (a of alarms(); track a.event.alarmId) {
    <span class="chip" [class.bad]="isUrgent(a)">{{ alarmTitle(a) }} · {{ a.event.status }}</span>
  }
  -->
</a>
