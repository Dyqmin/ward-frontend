<h2>S.4–8 · Nurse station alarms</h2>
<app-ward-picker />

<div class="row">
  <button type="button" class="refresh" (click)="refresh()">Refresh</button>
  @if (loading()) {
  <span class="loading muted">Loading alarms…</span>
  } @if (error(); as error) {
  <span class="error error-text">{{ error }}</span>
  }
</div>

<ul class="alarms">
  <!-- S.7c · on each app-alarm-row: [pending] is whether pending() includes the alarm's alarmId,
       and (acknowledge) calls acknowledge with that alarmId -->
  @for (a of alarms(); track a.alarmId) {
  <li><app-alarm-row [event]="a" /></li>
  } @empty {
  <li class="muted">No alarms</li>
  }
</ul>
