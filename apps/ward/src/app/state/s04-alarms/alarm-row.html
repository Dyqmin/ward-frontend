<div class="alarm" [class.open]="open()">
  <div>
    <strong>{{ event().bed }} · {{ title() }}</strong>
    <div class="muted status">{{ status() }}</div>
  </div>
  <div class="row">
    @if (pending()) {
    <span class="chip warn pending">pending sync…</span>
    } @if (open()) {
    <button
      type="button"
      class="primary small ack"
      [disabled]="pending()"
      (click)="acknowledge.emit()"
    >
      Acknowledge
    </button>
    }
  </div>
</div>
