<h2>S.3 · Selectors</h2>
<app-ward-picker />

<h3>Checked on the night round, in this ward</h3>
<ul class="checked-beds">
  @for (b of checked(); track b) {
  <li>{{ b }}</li>
  } @empty {
  <li class="muted">none yet</li>
  }
</ul>

<p class="row">
  <button type="button" class="small local" (click)="countClick()">
    Clicks on this tab
  </button>
  <span class="local-count">{{ clicks() }}</span>
</p>
