<h2>S.3 · Selectors</h2>
<app-ward-picker />

<h3>Checked on the night round, in this ward</h3>
<!-- S.3c · inside the ul: an @for over checked(), one <li> per bed; @empty: none yet -->
<ul class="checked-beds"></ul>

<p class="row">
  <button type="button" class="small local" (click)="countClick()">
    Clicks on this tab
  </button>
  <span class="local-count">{{ clicks() }}</span>
</p>
