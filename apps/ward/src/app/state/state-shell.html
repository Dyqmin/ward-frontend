<section class="page">
  <header class="row head">
    <h1>State</h1>
    <span class="muted">the NgRx global Store</span>
    <span class="spacer"></span>
    <div class="row helpers">
      <span class="muted">Test alarm</span>
      <select
        #bedSelect
        aria-label="Bed for the test alarm"
        (change)="pickBed(bedSelect.value)"
      >
        @for (b of beds; track b) {
        <option [value]="b" [selected]="b === testBed()">{{ b }}</option>
        }
      </select>
      <button type="button" class="small" (click)="setHr(140)">
        Raise HR to 140
      </button>
      <button type="button" class="small" (click)="setHr(72)">
        Back to 72
      </button>
      <button
        type="button"
        class="small"
        [disabled]="outageRunning()"
        (click)="outage()"
      >
        {{ outageRunning() ? 'Outage running…' : 'Simulate outage (12 s)' }}
      </button>
    </div>
  </header>

  <nav class="tabs">
    @for (t of tabs; track t.path) {
    <a class="button small" [routerLink]="t.path" routerLinkActive="primary"
      >{{ t.label }}</a
    >
    }
  </nav>

  <div class="layout">
    <section class="card exercise">
      <router-outlet />
    </section>
    <app-store-inspector />
  </div>
</section>
