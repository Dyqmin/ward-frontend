<h2>R.9 · combineLatest and debounceTime</h2>
<div class="row">
  <nav class="wards row">
    @for (w of wards; track w) {
    <button type="button" (click)="ward$.next(w)">{{ w }}</button>
    }
  </nav>
  <input
    #search
    class="search"
    placeholder="Search by name"
    (input)="search$.next(search.value)"
  />
</div>

<ul class="patients">
  @if (visible$ | async; as list) { @for (p of list; track p.id) {
  <li>{{ p.name }}</li>
  } }
</ul>
