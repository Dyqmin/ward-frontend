<h2>R.7–8 · Subject and BehaviorSubject</h2>
<div class="row">
  <input #note class="text" placeholder="A note" />
  <button type="button" (click)="add(note.value); note.value = ''">
    Add note
  </button>
  <button type="button" (click)="showLate.set(true)" [disabled]="showLate()">
    Show late panel
  </button>
</div>

<!-- R.8b · show notes$.value here, without the async pipe -->
<p class="current"></p>

<div class="panels">
  <section class="card early">
    <h3>Early</h3>
    <!-- R.7b · show notes$ with the async pipe -->
    <p class="note"></p>
  </section>
  @if (showLate()) {
  <section class="card late">
    <h3>Late</h3>
    <!-- R.7b · show notes$ with the async pipe -->
    <p class="note"></p>
  </section>
  }
</div>
