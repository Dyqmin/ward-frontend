<h2>R.10–12 · switchMap, mergeMap, exhaustMap</h2>

<section class="card">
  <h3>R.10–11 · the selected bed</h3>
  <nav class="row">
    @for (b of beds; track b) {
    <button type="button" (click)="selectedBed$.next(b)">{{ b }}</button>
    }
  </nav>
  <p class="live">{{ live$ | async }}</p>
</section>

<section class="card">
  <h3>R.12 · acknowledge</h3>
  <button type="button" (click)="ackClicks$.next()">Acknowledge</button>
  <p class="ack">{{ ack$ | async }}</p>
  <p class="requests">Requests sent: {{ requestsSent() }}</p>
</section>
