<section class="page">
  <header class="row head">
    <h1>Streams</h1>
    <span class="spacer"></span>
    @if (fake) {
    <span class="chip counter" [class.warn]="fake.activeVitals() > 1">
      Active vitals subscriptions: {{ fake.activeVitals() }}
    </span>
    } @else {
    <span class="chip warn"
      >Open this page with ?mock to see the subscription counter</span
    >
    }
  </header>

  <nav class="tabs">
    @for (t of tabs; track t.path) {
    <a class="button small" [routerLink]="t.path" routerLinkActive="primary"
      >{{ t.label }}</a
    >
    }
  </nav>

  <section class="card exercise">
    <router-outlet />
  </section>
</section>
