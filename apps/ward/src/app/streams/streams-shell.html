<section class="page">
  <header class="row head">
    <h1>Streams</h1>
    <span class="spacer"></span>
    <span class="chip counter" [class.warn]="bus.activeVitals() > 1">
      Active vitals subscriptions: {{ bus.activeVitals() }}
    </span>
  </header>

  <nav class="tabs">
    @for (t of tabs; track t.path) {
    <a class="button small" [routerLink]="t.path" routerLinkActive="primary"
      >{{ t.label }}</a
    >
    }
  </nav>

  <section class="card exercise">
    <router-outlet />
  </section>
</section>
