<section class="page">
  <h1>Signals warm-up</h1>

  <nav class="wards">
    @for (w of wards; track w) {
    <button type="button" [class.active]="ward() === w" (click)="ward.set(w)">
      {{ w }}
    </button>
    }
  </nav>

  <p class="count">{{ count() }} patients</p>

  <div class="layout">
    <ul class="patients">
      @for (p of visible(); track p.id) {
      <li [class.selected]="selected()?.id === p.id">
        <button type="button" class="name" (click)="selected.set(p)">
          {{ p.name }}
        </button>
        <span class="bed">{{ p.bed }}</span>
        <button type="button" class="discharge" (click)="discharge(p.id)">
          Discharge
        </button>
      </li>
      }
    </ul>

    <section class="card details">
      @if (selected(); as s) {
      <h2>{{ s.name }}</h2>
      <p>{{ s.bed }}</p>
      } @else {
      <p class="muted">No patient selected</p>
      }
    </section>
  </div>
</section>
