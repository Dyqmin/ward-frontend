<section class="page">
  <header class="row head">
    <h1>Signal Store</h1>
    <span class="muted">NgRx SignalStore</span>
  </header>

  <nav class="tabs">
    @for (t of tabs; track t.path) {
    <a class="button small" [routerLink]="t.path" routerLinkActive="primary"
      >{{ t.label }}</a
    >
    }
  </nav>

  <section class="card exercise">
    <router-outlet />
  </section>
</section>
