<h2>SS.7–9 · Lab 3: alarms as entities</h2>
<p class="row">
  <span class="count"
    >Open alarms: <strong>{{ store.openCount() }}</strong></span
  >
  <button type="button" class="small reload" (click)="store.reload()">
    Reload
  </button>
  @if (store.loading()) {
  <span class="muted loading">Reloading…</span>
  }
</p>

<ul class="alarms">
  @for (a of store.entities(); track a.id) {
  <li
    class="row"
    [class.high]="a.severity === 'high'"
    [class.selected]="a.id === store.selectedId()"
  >
    <button type="button" class="small select" (click)="store.select(a.id)">
      Select
    </button>
    <strong>{{ a.bed }}</strong>
    <span>{{ a.title }}</span>
    <span class="spacer"></span>
    @if (a.acknowledged) {
    <span class="chip ok">acknowledged</span>
    } @else {
    <button type="button" class="small" (click)="store.acknowledge(a.id)">
      Acknowledge
    </button>
    }
  </li>
  }
</ul>
