<h2>SS.7–9 · Lab 3: alarms as entities</h2>
<p class="row">
  <span class="count"
    >Open alarms: <strong>{{ store.openCount() }}</strong></span
  >
  <button type="button" class="small reload" (click)="store.reload()">
    Reload
  </button>
  <!-- SS.9 · replace false with store.loading() -->
  @if (false) {
  <span class="muted loading">Reloading…</span>
  }
</p>

<ul class="alarms">
  @for (a of store.entities(); track a.id) {
  <!-- SS.8 · class selected when a.id === store.selectedId() -->
  <li class="row" [class.high]="a.severity === 'high'">
    <!-- SS.8 · on click, call store.select(a.id) -->
    <button type="button" class="small select">Select</button>
    <strong>{{ a.bed }}</strong>
    <span>{{ a.title }}</span>
    <span class="spacer"></span>
    @if (a.acknowledged) {
    <span class="chip ok">acknowledged</span>
    } @else {
    <button type="button" class="small" (click)="store.acknowledge(a.id)">
      Acknowledge
    </button>
    }
  </li>
  }
</ul>
