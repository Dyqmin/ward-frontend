<h2>SS.1 · My beds</h2>
<app-my-beds-count />

<p class="mine">Mine: {{ store.beds().join(', ') }}</p>

@for (w of wards; track w) {
<div class="row beds">
  <span class="muted ward">{{ w }}</span>
  @for (bed of bedsOf(w); track bed) {
  <button
    type="button"
    class="small"
    [class.primary]="store.beds().includes(bed)"
    (click)="store.toggle(bed)"
  >
    {{ bed }}
  </button>
  }
</div>
}
