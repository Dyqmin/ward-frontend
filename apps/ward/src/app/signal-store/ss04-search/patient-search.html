<h2>SS.4–6 · Lab 2: search patients</h2>
<p class="row">
  <span class="chip requests">Requests sent: {{ directory.requests() }}</span>
  @if (store.loading()) {
  <span class="muted loading">Loading…</span>
  }
</p>

<input
  #input
  type="search"
  class="search"
  placeholder="Patient name…"
  (input)="store.setTerm(input.value)"
/>

<ul class="patients">
  @for (p of store.patients(); track p.id) {
  <li>{{ p.name }} <span class="muted">{{ p.bed }}</span></li>
  }
</ul>
