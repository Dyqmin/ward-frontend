<h2>SS.4–6 · Lab 2: search patients</h2>
<p class="row">
  <span class="chip requests">Requests sent: {{ directory.requests() }}</span>
  <!-- SS.4e · replace false with store.loading() -->
  @if (false) {
  <span class="muted loading">Loading…</span>
  }
</p>

<!-- SS.4e · on input, call store.load(input.value) (SS.5d: store.setTerm) -->
<input #input type="search" class="search" placeholder="Patient name…" />

<ul class="patients">
  <!-- SS.4e · loop over store.patients() -->
  @for (p of noPatients; track p.id) {
  <li>{{ p.name }} <span class="muted">{{ p.bed }}</span></li>
  }
</ul>
