<h2>SS.2 · Lab 1: the alarms store</h2>
<app-alarm-counter />

<label class="row only-high">
  <input
    type="checkbox"
    [checked]="store.onlyHigh()"
    (change)="store.toggleOnlyHigh()"
  />
  Only high
</label>

<ul class="alarms">
  @for (a of store.visibleAlarms(); track a.id) {
  <li class="row" [class.high]="a.severity === 'high'">
    <strong>{{ a.bed }}</strong>
    <span>{{ a.title }}</span>
    <span class="spacer"></span>
    @if (a.acknowledged) {
    <span class="chip ok">acknowledged</span>
    } @else {
    <button type="button" class="small" (click)="store.acknowledge(a.id)">
      Acknowledge
    </button>
    }
  </li>
  }
</ul>
