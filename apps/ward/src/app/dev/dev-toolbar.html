@if (fake) {
<aside class="toolbar" [class.open]="open()">
  <button type="button" class="small toggle" (click)="open.set(!open())">
    🛠 Dev {{ open() ? '▾' : '▸' }}
  </button>
  @if (open()) {
  <div class="row">
    <span class="muted">Role</span>
    @for (r of roles; track r) {
    <button
      type="button"
      class="small"
      [class.primary]="auth.role() === r"
      (click)="switchRole(r)"
    >
      {{ r }}
    </button>
    }
  </div>
  <div class="row">
    <button
      type="button"
      class="small danger"
      [disabled]="!fake.connected()"
      (click)="fake.simulateOutage(8000)"
    >
      Simulate outage (8 s)
    </button>
    <button type="button" class="small" (click)="fake.clearLog()">
      Clear log
    </button>
  </div>
  <table class="log">
    <thead>
      <tr>
        <th>Time</th>
        <th>Destination</th>
        <th>commandId</th>
        <th>Outcome</th>
      </tr>
    </thead>
    <tbody>
      @for (e of fake.log().slice(-12).reverse(); track $index) {
      <tr>
        <td>{{ time(e.at) }}</td>
        <td>{{ e.destination }}</td>
        <td class="id">{{ e.commandId?.slice(0, 8) ?? '–' }}</td>
        <td
          [class.bad]="e.outcome === 'offline'"
          [class.warn]="e.outcome === 'duplicate'"
        >
          {{ e.outcome }}
        </td>
      </tr>
      } @empty {
      <tr>
        <td colspan="4" class="muted">No requests yet.</td>
      </tr>
      }
    </tbody>
  </table>
  }
</aside>
}
