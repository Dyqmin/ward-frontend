<main class="page">
  <wm-page-header
    heading="Pharmacy desk"
    subtitle="Medication ordered on the wards, waiting to be prepared"
  />

  <div class="stats">
    <wm-stat-tile label="To prepare" [value]="toPrepare().length" />
    <wm-stat-tile label="Prepared today" [value]="done()" />
  </div>

  <wm-card heading="Orders to prepare">
    @if (toPrepare().length) {
    <wm-badge cardAside tone="warn">{{ toPrepare().length }} open</wm-badge>
    } @for (o of toPrepare(); track o.id) {
    <div class="order">
      <strong>{{ o.drug }} {{ o.doseMg }} mg</strong>
      <span
        >{{ o.route === 'iv' ? 'IV' : 'oral' }} · patient {{ o.patientId
        }}</span
      >
      <span class="muted">ordered {{ time(o.createdAt) }}</span>
    </div>
    } @empty {
    <wm-empty-state message="Nothing to prepare." />
    }
  </wm-card>
</main>
